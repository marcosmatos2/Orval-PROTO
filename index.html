function onBind(k){
  if(/^(dh|wal|bk)\.(per|type|cur|m|st)$/.test(k))setPath(k.split('.')[0]+'.page',1);
  if(k==='nb.country'){S.nb.mi=-1;S.nb.f={};S.nb.sub=false;}
  if(k==='pay.code')S.pay.err='';if(k==='send.code')S.send.err='';if(k==='login.code')S.login.err='';if(k==='itx.code')S.itx.err='';if(k==='cq.code'&&S.cq)S.cq.err='';
  if(k==='itx.q')S.itx.to=itxFind(S.itx.q);
  if(k==='onb.code')S.onb.codeErr='';if(k==='onb.tfa')S.onb.tfaErr='';
  if(k==='mailTx')history.replaceState(null,'','#/email?kind='+S.mailKind+'&tx='+S.mailTx);
}
function bindEl(el){const k=el.dataset.bind;let v=el.type==='checkbox'?el.checked:el.value;if(el.getAttribute('inputmode')==='numeric')v=String(v).replace(/\D/g,'').slice(0,6);setPath(k,v);onBind(k);render();}
function copyText(t){const done=()=>toast('Copied to clipboard');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>{legacyCopy(t);done();});}else{legacyCopy(t);done();}}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ===================== camada de pontos ===================== */
let hosts=[];
const isDrawer=()=>window.matchMedia('(max-width:1359px)').matches;
function drawMarkers(){
  const layer=$('#pt-layer');layer.innerHTML='';hosts=[];
  const def=SCR[S.r.key];
  if(CLEAN||!S.pts||def.mode==='doc'){renderPanel([]);return;}
  const modal=$('#modal-root .modal');
  const roots=modal?[modal]:[$('#view')].concat(S.r.key==='home'?[$('#sb')]:[]);
  const order=[];
  roots.forEach(root=>$$('[data-pt]',root).forEach(el=>{
    const ids=el.dataset.pt.split(/\s+/).filter(id=>PT[id]);if(!ids.length)return;
    el.classList.add('pt-host');
    const g=document.createElement('div');g.className='pt-g';
    g.innerHTML=ids.map(id=>'<button type="button" tabindex="-1" class="pt-pill t-'+PT[id].t+'" data-act="ptShow" data-id="'+id+'" title="'+esc(id+': '+PT[id].title)+'">'+id+'</button>').join('');
    layer.appendChild(g);hosts.push([el,g]);ids.forEach(id=>{if(!order.includes(id))order.push(id);});
  }));
  placeMarkers();renderPanel(order);
}
function headerBottom(){if($('#modal-root .modal'))return 0;let b=$('#strip').getBoundingClientRect().bottom;const tb=$('#topbar');if(document.body.classList.contains('mode-app')&&tb.offsetParent!==null)b=Math.max(b,tb.getBoundingClientRect().bottom);return Math.max(0,Math.round(b));}
function placeMarkers(){
  const layer=$('#pt-layer');if(!hosts.length)return;
  const top=headerBottom();layer.style.setProperty('--pt-top',top+'px');
  const cache=new Map();const clipOf=a=>{if(!cache.has(a)){const cs=getComputedStyle(a);cache.set(a,cs.overflowX!=='visible'||cs.overflowY!=='visible');}return cache.get(a);};
  hosts.forEach(([el,g])=>{
    if(!el.isConnected){g.hidden=true;return;}
    const r=el.getBoundingClientRect();if(!r.width&&!r.height){g.hidden=true;return;}
    let x=r.right,y=r.top,vis=true;
    for(let a=el.parentElement;a&&a!==document.body&&a!==document.documentElement;a=a.parentElement){
      if(a.id==='pt-layer')break;
      if(clipOf(a)){const ar=a.getBoundingClientRect();if(r.right<ar.left+6||r.left>ar.right-6||r.bottom<ar.top+2||r.top>ar.bottom-2){vis=false;break;}x=Math.min(x,ar.right-2);y=Math.max(y,ar.top);}
    }
    if(vis&&(r.right<=4||r.left>=innerWidth-4||r.bottom<=top+4||r.top>=innerHeight))vis=false;
    g.hidden=!vis;if(vis){y=Math.max(y,top+10);g.style.left=Math.round(Math.min(Math.max(x,48),innerWidth-2))+'px';g.style.top=Math.round(y-top)+'px';}
  });
}
function showPoint(id){if(isDrawer()&&!S.npOpen){S.npOpen=true;render();}const el=document.getElementById('np-'+id);if(!el)return;el.scrollIntoView({block:'nearest',behavior:'smooth'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),1800);}
function locatePoint(id){if(isDrawer()&&S.npOpen){S.npOpen=false;render();}
  let h=hosts.find(([el])=>el.dataset.pt.split(/\s+/).includes(id));if(!h)return;
  if(h[0].closest('#sb')&&window.matchMedia('(max-width:1023px)').matches&&!S.sbOpen){S.sbOpen=true;render();h=hosts.find(([el])=>el.dataset.pt.split(/\s+/).includes(id));if(!h)return;}
  const el=h[0];
  el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('pt-flash');void el.offsetWidth;el.classList.add('pt-flash');setTimeout(()=>el.classList.remove('pt-flash'),1500);}

/* ===================== onde cada ponto aparece (varredura das telas) ===================== */
const PT_ORDER={};Object.keys(PT).forEach((k,i)=>{PT_ORDER[k]=i;});
let WHERE={},SCREEN_PTS={},CARD_PTS={};
function probeHref(k){if(k==='pay/review')return '#/pay/review?demo=1';if(k==='pay/status')return '#/pay/status?demo=1';if(k==='tx')return '#/tx/t7';return '#/'+k;}
function buildWhere(){
  if(CLEAN)return;
  const P=[['home'],['home',s=>{s.bank.state='approved';}],['home',s=>{s.bank.state='review';}],['home',s=>{s.who='operator';}],['home',s=>{s.who='treasury';}],['home',s=>{s.who='single';}],['move'],['move',s=>{s.who='operator';}],['move',s=>{s.who='viewer';}],['team'],['team',s=>{s.modal={type:'invite'};}],['team',s=>{s.rc={role:'viewer'};s.modal={type:'role',id:'m4'};}],['team',s=>{s.modal={type:'policy'};}],['team',s=>{s.who='single';}],
    ['pay'],['pay',s=>{s.pay.ben='b2';s.pay.amt='9000000';}],['pay',s=>{s.pay.ben='b8';s.pay.amt='50000';}],['pay',s=>{s.who='viewer';}],
    ['pay/review',s=>demoPay(s)],['pay/review',s=>{demoPay(s);s.pay.ben='b8';}],['pay/review',s=>{demoPay(s);s.who='operator';}],['pay/status',s=>{s.lastPay='t9';}],
    ['tx',null,'t7'],['tx',null,'t6'],['tx',null,'t4'],['tx',null,'t8'],['tx',null,'t14'],['tx',s=>{s.who='treasury';s.cq={id:'t14',until:Date.now()+60000,code:'',err:''};},'t14'],['tx',null,'t15'],['tx',null,'t10'],['tx',null,'t5'],['tx',null,'t3'],['tx',null,'t11'],['tx',null,'t12'],['tx',null,'t13'],['transactions'],
    ['beneficiaries'],['beneficiaries',s=>{s.modal={type:'deact',id:'b6'};}],
    ['beneficiaries/new'],['beneficiaries/new',s=>{s.nb.step=2;s.nb.country='DE';}],['beneficiaries/new',s=>{Object.assign(s.nb,{step:3,country:'DE',mi:0,f:{iban:'DE89370400440532013000'}});}],['beneficiaries/new',s=>{Object.assign(s.nb,{step:4,country:'DE',mi:0,f:{name:'X',iban:'DE89370400440532013000',email:'a@b.example'}});}],['beneficiaries/new',s=>{Object.assign(s.nb,{step:5,saved:'b1'});}],
    ['wallets'],['wallets',s=>{s.who='operator';}],['wallets',s=>{s.modal={type:'send'};}],['wallets',s=>{s.modal={type:'send'};s.send.kind='fiat';}],['wallets',s=>{s.modal={type:'send'};Object.assign(s.send,{step:2,addr:'0x9c2d4e7a1b3f5c8d0e2a4b6c8d0e1f3a5b7c11f4',amt:'100'});}],
    ['wallets',s=>{s.modal={type:'itx'};}],['wallets',s=>{s.modal={type:'itx'};Object.assign(s.itx,{q:'@chaco',to:'o1'});}],['wallets',s=>{s.modal={type:'itx'};Object.assign(s.itx,{step:2,q:'@chaco',to:'o1',amt:'100'});}],
    ['banking'],['banking',s=>{s.bank.state='review';}],['banking',s=>{s.bank.state='approved';}],['banking',s=>{s.bank.state='approved';s.modal={type:'bkAck',next:'reveal',k:'Account number'};}],['banking',s=>{s.modal={type:'apply'};}],['banking',s=>{s.bank.state='approved';s.modal={type:'bkDetails'};}],['transactions',s=>{s.bank.state='approved';}],
    ['deposit',s=>{s.modal={type:'dep'};}],['deposit',s=>{s.modal={type:'dep'};s.dep.opt='usdt-tron';s.dep.dd=true;}],['deposit',s=>{s.who='viewer';s.modal={type:'dep'};}],['home',s=>{s.modal={type:'settings'};}],
    ['deposit/fiat',s=>{s.dep.brl='50000';s.dep.pixUntil=Date.now()+300000;}],['deposit/fiat',s=>{s.dep.cur='EUR';}],
    ['email'],['email',s=>{s.mailKind='team';}],['login'],['login',s=>{s.login.stage='2fa';}],['login',s=>{s.login.stage='forgot';}],['login',s=>{s.login.stage='sent';}],['login',s=>{s.login.stage='lost';}],
    ['onboarding/1'],['onboarding/2'],['onboarding/2',s=>{s.onb.verified=true;}],['onboarding/3'],['onboarding/3',s=>{s.onb.tfaOk=true;}],['onboarding/4'],['onboarding/5'],['onboarding/6'],['onboarding/7'],['onboarding/8'],['onboarding/8',s=>{s.onb.status='Approved';}]];
  const saved=S,unknown=new Set();SCREEN_PTS={};
  P.forEach(([key,setup,arg])=>{
    S=freshState();if(setup)setup(S);
    const r={key,arg:arg||null,params:new URLSearchParams()};
    let html=VIEW[key](r)+(S.modal?rModal():'')+(key==='home'?rSidebar('home')+rTopbar(SCR.home):'');
    const L=SCREEN_PTS[key]||(SCREEN_PTS[key]=[]);
    (html.match(/data-pt="[^"]*"/g)||[]).forEach(m=>m.slice(9,-1).split(/\s+/).forEach(id=>{if(!id)return;if(!PT[id]){unknown.add(id);return;}if(!L.includes(id))L.push(id);}));
  });
  S=saved;
  const byOrder=(a,b)=>PT_ORDER[a]-PT_ORDER[b];
  Object.keys(SCREEN_PTS).forEach(k=>SCREEN_PTS[k].sort(byOrder));
  const order=SMAP.flatMap(g=>g.items.map(x=>x[0]));order.splice(order.indexOf('transactions')+1,0,'tx');
  WHERE={};order.forEach(k=>(SCREEN_PTS[k]||[]).forEach(id=>{(WHERE[id]=WHERE[id]||[]).push(k);}));
  CARD_PTS=Object.assign({},SCREEN_PTS,{transactions:[...new Set((SCREEN_PTS.transactions||[]).concat(SCREEN_PTS.tx||[]))].sort(byOrder)});
  if(unknown.size)console.warn('Pontos sem cadastro:',[...unknown].join(', '));
}

/* ===================== eventos e início ===================== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  let closed=false;if(S.menu&&!e.target.closest('.menu-w')){S.menu=null;closed=true;}
  if(!a){if(closed)render();return;}
  const f=ACT[a.dataset.act];if(!f){if(closed)render();return;}
  if(a.tagName==='A')e.preventDefault();const rc=RC;f(a,e);if(closed&&RC===rc)render();
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.submit;if(f&&ACT[f])ACT[f](e.target,e);});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;if(el.matches('select,input[type=checkbox],input[type=radio]'))return;bindEl(el);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='st-sel'){location.hash=el.value;return;}if(!el.dataset||!el.dataset.bind)return;if(el.matches('select,input[type=checkbox],input[type=radio]'))bindEl(el);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal&&S.modal.type==='dep'&&S.dep.dd){S.dep.dd=false;render();const b=$('.dd-btn');if(b)b.focus();}else if(S.modal){S.modal=null;render();}else if(S.menu){S.menu=null;render();}else if(S.npOpen||S.sbOpen){S.npOpen=false;S.sbOpen=false;render();}return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',()=>{S.menu=null;S.modal=null;S.sbOpen=false;S.npOpen=false;render();});
let rafP=0;const schedule=()=>{if(rafP)return;rafP=requestAnimationFrame(()=>{rafP=0;placeMarkers();});};
window.addEventListener('scroll',schedule,{passive:true,capture:true});
window.addEventListener('resize',schedule);
setInterval(tick,1000);
function boot(){
  const sel=$('#st-sel');sel.innerHTML='<option value="#/indice">'+(CLEAN?'Telas':'Índice dos pontos')+'</option>'+SMAP.map(g=>'<optgroup label="'+esc(g.g)+'">'+g.items.map(([k,l])=>'<option value="'+probeHref(k)+'">'+esc(l)+'</option>').join('')+'</optgroup>').join('');
  buildWhere();
  if(!location.hash)history.replaceState(null,'','#/indice');
  render();
  if(window.ResizeObserver){const ro=new ResizeObserver(schedule);ro.observe(document.body);ro.observe($('#view'));}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
}
boot();
